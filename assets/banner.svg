<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 200" width="100%" height="200">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4facfe;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#00f2fe;stop-opacity:1" />
      <animate attributeName="x1" values="0%;100%;0%" dur="10s" repeatCount="indefinite" />
      <animate attributeName="y1" values="0%;100%;0%" dur="10s" repeatCount="indefinite" />
      <animate attributeName="x2" values="100%;0%;100%" dur="10s" repeatCount="indefinite" />
      <animate attributeName="y2" values="100%;0%;100%" dur="10s" repeatCount="indefinite" />
    </linearGradient>
  </defs>
  <rect width="800" height="200" rx="15" ry="15" fill="url(#grad1)" />
  <text x="50%" y="45%" dominant-baseline="middle" text-anchor="middle" font-family="Arial, sans-serif" font-size="40" font-weight="bold" fill="#ffffff">
    Awesome Workplace Reservation Platform
  </text>
  <text x="50%" y="70%" dominant-baseline="middle" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" fill="#ffffff">
    Curated List of SaaS Products &amp; Open-Source Projects
  </text>
  
  <circle cx="100" cy="100" r="10" fill="#ffffff" opacity="0.5">
    <animate attributeName="cy" values="100;80;100" dur="2s" repeatCount="indefinite" />
  </circle>
  <circle cx="700" cy="100" r="10" fill="#ffffff" opacity="0.5">
    <animate attributeName="cy" values="100;120;100" dur="2s" repeatCount="indefinite" />
  </circle>
</svg>